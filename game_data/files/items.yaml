    Alguien las dejó aquí entre los instrumentos. La marca Peters. Encajan en el
    revólver Smith & Wesson."
  flags: [TAKEABLE]
  children: []
  properties:
    caliber: .38 Special
    count: casi completa, unas 40 balas
    brand: Peters

- id: dropped_gun
  name: pistola abandonada
  synonyms: [pistola, revólver, arma, gun, smith wesson, revolver]
  base_description: "Un revólver en el suelo. Los entendidos lo reconocen como un
    Smith & Wesson especial. Tiene el tambor parcialmente vacío."
  flags: [TAKEABLE, EVIDENCE, CLUE_SOURCE]
  children: []
  properties:
    bullets: uno disparado
    ammo: 9mm
    age: nueva o muy bien cuidada
    grips: madera
  interactions:
    - action: use
      with: jenny_dead_body
      conditions: []
      on_success:
        - reveal_clue: shooting_angle
        - message: >
            Comparas la posición de la pistola con el orificio de bala en la
            espalda de Jenny. El ángulo lo dice todo: fue disparada desde atrás,
            a distancia. No hubo forcejeo. Fue una ejecución mientras huía.
      on_failure:
        - message: null
    - action: use
      with: balas_extra
      conditions:
        - has_item: dropped_gun
      on_success:
        - set_flag: pistola_cargada
        - message: >
            Introduces las balas en el tambor vacío. El revólver está listo.
            Esperas no tener que usarlo.
      on_failure:
        - message: "Necesitas llevar la pistola encima para poder cargarla."

- id: jenny_dead_body
  name: cuerpo de Jenny
  synonyms: [cuerpo, cadáver, Jenny, muerta, víctima, cuerpo de jenny]
  base_description: "El cuerpo de una mujer yace en el suelo con un revólver cerca
    de su mano. Está boca abajo en un charco de sangre, con un orificio de bala
    en la espalda."
  flags: [FIXED, EVIDENCE, CLUE_SOURCE]
  children: []
  properties:
    wears: un abrigo largo marrón estiloso pero viejo
    shoes: tacones negros con suela de goma muy usada
    face: mujer de unos 20-25 años con pendientes de diamante pequeños, probablemente falsos
    name: Jenny Walters
    hole: el orificio parece el punto de entrada; cayó hacia adelante, huía del asesino

- id: old_decorative_piano
  name: piano decorativo
  synonyms: [piano, piano viejo, instrumento, piano decorativo]
  base_description: "Un piano vertical envejecido junto al escenario, más decorativo
    que funcional. La madera de caoba está desvaída. Sobre él reposa una fotografía
    enmarcada en blanco y negro."
  flags: [FIXED, SCENERY, SURFACE]
  children: []
  properties:
    condition: gastado pero funcional, algunas teclas se atascan
    photograph: pianista negro sonriente de los años 40-50
    tuning: claramente desafinado

- id: band_posters
  name: pósters de bandas
  synonyms: [pósters, carteles, posters, anuncios, cartelería]
  base_description: "Decenas de pósters cubren las paredes del corredor, mostrando
    bandas que han tocado aquí a lo largo de los años. Van desde leyendas del jazz
    en blanco y negro hasta coloridos anuncios modernos."
  flags: [FIXED, SCENERY]
  children: []
  properties:
    style: mezcla de diseños vintage y modernos
    condition: algunos desteñidos, otros recientes
    content: músicos de jazz, artistas de blues y algún grupo de rock

- id: music_stands
  name: atriles de música
  synonyms: [atril, atriles, soporte música, music stand]
  base_description: "Varios atriles de metal ajustables distribuidos por la sala.
    Algunos están plegados, otros tienen partituras todavía sujetas."
  flags: [TAKEABLE]
  children: []
  properties:
    material: metal negro con altura ajustable
    condition: funcionales pero muy usados
    quantity: unos cinco atriles

- id: spare_instruments
  name: instrumentos de repuesto
  synonyms: [instrumentos, trompeta, saxofón, clarinete, instrumento repuesto]
  base_description: "Una colección de instrumentos de reserva: una trompeta, un
    saxofón y un clarinete en sus estuches. Son los instrumentos del club para
    emergencias."
  flags: [TAKEABLE]
  children: []
  properties:
    types: trompeta, saxofón, clarinete
    condition: funcionales pero no de primera calidad
    storage: guardados en estuches protectores

- id: dressing_mirror
  name: espejo de camerino
  synonyms: [espejo, mirror, espejo camerino, espejo vestidor]
  base_description: "Un espejo rectangular montado en la pared rodeado de bombillas
    al estilo clásico de camerino. Varios de los bombillas están fundidos."
  flags: [FIXED]
  children: []
  properties:
    style: espejo de camerino clásico con bombillas

- id: office_desk
  name: escritorio de la oficina
  synonyms: [escritorio, mesa, desk, mesa oficina]
  base_description: "Un viejo escritorio de madera cubierto de papeleo, recibos
    y contratos de actuaciones. Tiene varios cajones y muestra años de uso intenso
    con manchas de café y marcas de bolígrafo."
  flags: [FIXED, SURFACE, CONTAINER]
  children: []
  properties:
    material: madera oscura con varios cajones
    condition: muy usado con manchas y marcas
    contents: papeleo y material de oficina

- id: filing_cabinets
  name: archivadores
  synonyms: [archivador, archivadores, cabinet, filing cabinet, archivos]
  base_description: "Dos archivadores metálicos altos contra la pared, llenos de
    contratos, recibos y registros del club. Los cajones están etiquetados por
    año y algunos entreabiertos."
  flags: [FIXED, CONTAINER]
  children: []
  properties:
    material: metal con varios cajones
    condition: funcionales pero muy usados
    contents: contratos, recibos, registros del club


- id: band_room
  name: Sala de la banda
  synonyms: [sala banda, banda, músicos, camerino]
  base_description: "Una pequeña sala donde los músicos se preparan antes de salir
    al escenario. Huele a cera de instrumento y sudor. Hay ropa y estuches de
    instrumentos por todas partes."
  flags: []
  children:
    - music_stands
    - spare_instruments
    - dressing_mirror
